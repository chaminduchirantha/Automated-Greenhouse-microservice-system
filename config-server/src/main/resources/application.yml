server:
  port: 8888

spring:
  application:
    name: config-server
  
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
        default-label: main

# Enable health check endpoint
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# Logging configuration
logging:
  level:
    root: INFO
    org.springframework.cloud.config: DEBUG
