# ============================================================
# Automation Service - Configuration Properties
# ============================================================
# Server Configuration
server.port=8083

# Spring Application Configuration
spring.application.name=automation-service

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/agms_automation_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Eureka Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Spring Cloud Config Configuration
spring.cloud.config.uri=http://localhost:8888
spring.cloud.config.fail-fast=false

# Logging Configuration
logging.level.root=INFO
logging.level.lk.ijse.gdse.automationservice=DEBUG

# OpenFeign Configuration
feign.client.config.default.loggerLevel=BASIC
feign.client.config.ZONE-SERVICE.loggerLevel=FULL

